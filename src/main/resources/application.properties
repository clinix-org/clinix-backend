spring.application.name=clinix
# Fail-safe: sem perfil explicito, aplica as restricoes de producao.
spring.profiles.default=prod

# Segredos e dados de infraestrutura sao fornecidos exclusivamente pelo ambiente.
# A aplicacao falha na inicializacao quando uma variavel obrigatoria esta ausente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# O bootstrap fica desligado por padrao e nunca possui senha padrao.
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.name=${ADMIN_NAME:Administrador}
app.bootstrap.admin.active=${ADMIN_ACTIVE:true}
